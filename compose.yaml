services:

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: module4db
      POSTGRES_USER: module4user
      POSTGRES_PASSWORD: change-this-password
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: module4db
      POSTGRES_USER: module4user
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: